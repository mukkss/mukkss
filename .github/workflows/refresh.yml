name: Refresh Data

on:
  schedule:
    - cron: '0 0 * * *' # Run at midnight every day
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml # Assuming pyproject.toml defines the deps

      - name: Fetch and generate
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: python3 scripts/build_all.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update github stats" && git push)
